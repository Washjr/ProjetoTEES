<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      .book-cover { fill: #3e52e7; }
      .book-spine { fill: #2d3db3; }
      .book-pages { fill: #f8f9fa; }
      .book-shadow { fill: #e9ecef; }
    </style>
  </defs>
  
  <!-- Sombra do livro -->
  <path class="book-shadow" d="M5 28 L25 28 L27 26 L7 26 Z"/>
  
  <!-- Páginas do livro -->
  <rect class="book-pages" x="5" y="6" width="18" height="20" rx="1"/>
  
  <!-- Capa do livro -->
  <rect class="book-cover" x="4" y="5" width="19" height="21" rx="1"/>
  
  <!-- Lombada do livro -->
  <rect class="book-spine" x="4" y="5" width="3" height="21" rx="1"/>
  
  <!-- Detalhes da capa -->
  <line x1="9" y1="9" x2="19" y2="9" stroke="#ffffff" stroke-width="0.8"/>
  <line x1="9" y1="12" x2="17" y2="12" stroke="#ffffff" stroke-width="0.6"/>
  <line x1="9" y1="14" x2="15" y2="14" stroke="#ffffff" stroke-width="0.6"/>
  
  <!-- Marcador de página -->
  <rect x="20" y="5" width="1.5" height="8" fill="#ff6b6b"/>
</svg>